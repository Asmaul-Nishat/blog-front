<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact Us - Blog Posting Website</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --black: #000000;
      --white: #f0f0f0;
      --gray: #dddddd;
      --input-border: #999999;
      --radius: 10px;
      --shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
      --primary-color: #cb9191;
      --label-text: #666666;
      --error-text: red;
      --text-color: #222222;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Merriweather', serif;
      background-color: var(--white);
      color: var(--text-color);
      min-height: 100vh;
      padding-top: 70px;
    }

    /* Navbar styles */
    nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background-color: var(--white);
      box-shadow: var(--shadow);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.8rem 2rem;
      z-index: 1000;
      border-bottom: 1px solid var(--gray);
    }

    .logo {
      font-weight: 700;
      font-size: 1.5rem;
      color: var(--primary-color);
      font-family: 'Merriweather', serif;
      cursor: pointer;
      user-select: none;
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      gap: 2rem;
      font-size: 1rem;
      font-weight: 600;
    }

    .nav-links a {
      text-decoration: none;
      color: var(--black);
      transition: color 0.3s ease;
      padding: 0.3rem 0.5rem;
      border-radius: var(--radius);
    }

    .nav-links a:hover,
    .nav-links a:focus {
      color: var(--primary-color);
      background-color: rgba(203, 145, 145, 0.15);
    }

    /* Container styles */
    .container {
      max-width: 900px;
      background-color: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 3rem 4rem;
      border: 1px solid var(--gray);
      margin: 0 auto 4rem auto;
    }

    h1 {
      font-size: 2.75rem;
      color: var(--primary-color);
      text-align: center;
      margin-bottom: 1rem;
      font-weight: 700;
    }

    hr {
      border: none;
      height: 3px;
      background-color: var(--primary-color);
      width: 100px;
      margin: 0 auto 2rem auto;
      border-radius: var(--radius);
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    label {
      font-weight: 600;
      color: var(--label-text);
      margin-bottom: 0.3rem;
      font-size: 1.1rem;
    }

    input[type="text"],
    input[type="email"],
    textarea {
      padding: 0.75rem 1rem;
      font-size: 1rem;
      border: 1.5px solid var(--input-border);
      border-radius: var(--radius);
      font-family: 'Merriweather', serif;
      resize: vertical;
      transition: border-color 0.3s ease;
    }

    input[type="text"]:focus,
    input[type="email"]:focus,
    textarea:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 5px rgba(203, 145, 145, 0.6);
    }

    textarea {
      min-height: 120px;
    }

    button {
      align-self: flex-start;
      background-color: var(--primary-color);
      color: var(--white);
      border: none;
      padding: 0.8rem 2rem;
      font-size: 1.1rem;
      font-weight: 700;
      border-radius: var(--radius);
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover,
    button:focus {
      background-color: #b76f6f;
      outline: none;
    }

    /* Success notification */
    .success-message {
      display: none;
      margin-bottom: 1.5rem;
      padding: 1rem 1.2rem;
      background-color: var(--gray);
      border: 1px solid var(--primary-color);
      border-radius: var(--radius);
      color: var(--text-color);
      font-size: 0.95rem;
      text-align: center;
    }

    .success-message.show {
      display: block;
    }

    .footer {
      margin-top: 3rem;
      text-align: center;
      font-size: 0.9rem;
      color: var(--gray);
      font-style: italic;
    }

    /* Responsive */
    @media (max-width: 700px) {
      nav {
        padding: 0.6rem 1rem;
      }

      .nav-links {
        gap: 1rem;
        font-size: 0.9rem;
      }

      .container {
        padding: 2rem 1.5rem;
      }

      h1 {
        font-size: 2rem;
      }

      label {
        font-size: 1rem;
      }

      input[type="text"],
      input[type="email"],
      textarea {
        font-size: 0.95rem;
      }

      button {
        font-size: 1rem;
        padding: 0.7rem 1.5rem;
      }
    }
  </style>

</head>

<body>

  <nav>
    <a href="index.html" class="logo">Blogg</a>


<div class="nav-links">
  <a href="index.html">Home</a>
  <a href="create.html">Write Blog</a>
  <a href="login.html">Login</a>
</div>


  </nav>

  <div class="container">


<h1>Contact Us</h1>

<hr />


<!-- Success Notification -->

<div
  id="successMessage"
  class="success-message"
  role="alert"
>
  Message sent successfully!
</div>


<!-- Contact Form -->

<form
  id="contactForm"
  novalidate
>

  <label for="name">
    Full Name
  </label>

  <input
    type="text"
    id="name"
    name="name"
    placeholder="Your full name"
    required
  />


  <label for="email">
    Email Address
  </label>

  <input
    type="email"
    id="email"
    name="email"
    placeholder="you@example.com"
    required
  />


  <label for="subject">
    Subject
  </label>

  <input
    type="text"
    id="subject"
    name="subject"
    placeholder="Subject of your message"
    required
  />


  <label for="message">
    Message
  </label>

  <textarea
    id="message"
    name="message"
    placeholder="Write your message here..."
    required
  ></textarea>


  <button type="submit">
    Send Message
  </button>

</form>


<div class="footer">
  © 2025 Our Blog Posting Website. All rights reserved.
</div>

  </div>

  <script>

    const contactForm =
      document.getElementById("contactForm");

    const successMessage =
      document.getElementById("successMessage");


    contactForm.addEventListener(
      "submit",
      function (event) {

        /*
         * Prevent the browser from
         * submitting/reloading the page.
         */
        event.preventDefault();


        /*
         * Get form values.
         */
        const name =
          document.getElementById("name").value.trim();

        const email =
          document.getElementById("email").value.trim();

        const subject =
          document.getElementById("subject").value.trim();

        const message =
          document.getElementById("message").value.trim();


        /*
         * Basic validation.
         */
        if (
          !name ||
          !email ||
          !subject ||
          !message
        ) {

          alert("Please fill in all fields.");

          return;
        }


        /*
         * Basic email validation.
         */
        const emailPattern =
          /^[^\s@]+@[^\s@]+\.[^\s@]+$/;


        if (!emailPattern.test(email)) {

          alert("Please enter a valid email address.");

          return;
        }


        /*
         * Show success notification.
         */
        successMessage.textContent =
          "Message sent successfully!";

        successMessage.classList.add("show");


        /*
         * Clear the form.
         */
        contactForm.reset();


        /*
         * Keep the user on the same page.
         *
         * Hide notification after 4 seconds.
         */
        setTimeout(function () {

          successMessage.classList.remove("show");

        }, 4000);

      }
    );

  </script>

</body>
</html>
