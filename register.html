<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register - MyBlog</title>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --black: #000;
      --white: #f0f0f0;
      --gray: #ddd;
      --input-border: #999;
      --radius: 10px;
      --shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Merriweather', serif;
      background-color: var(--white);
      color: var(--black);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      min-height: 100vh;
    }
    .container {
      display: flex;
      width: 100%;
      max-width: 900px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .image-side {
      flex: 1;
      background-color: var(--white);
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .image-side img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .form-side {
      flex: 1;
      background-color: var(--white);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 3rem 2rem;
      position: relative;
    }
    .card { width: 100%; max-width: 400px; }
    h1 { text-align: center; margin-bottom: 2rem; font-size: 2rem; }
    form { display: grid; gap: 1rem; }
    .form-group { position: relative; }
    .form-group input,
    .form-group select {
      width: 100%;
      padding: 1rem 0.75rem;
      border: 1px solid var(--input-border);
      border-radius: var(--radius);
      font-size: 1rem;
    }
    button {
      width: 100%;
      background-color: var(--black);
      padding: 0.9rem;
      font-size: 1rem;
      color: var(--white);
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      transition: background 0.3s;
    }
    button:hover { background: #cb9191; color: #000; }
    .footer {
      text-align: center;
      margin-top: 1rem;
      font-size: 0.9rem;
    }
    .footer a {
      color: var(--black);
      border-bottom: 1px solid var(--black);
      text-decoration: none;
    }
    .footer a:hover { color: #d19393; }
    @media (max-width: 768px) {
      .container { flex-direction: column; }
      .image-side { height: 200px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="image-side">
      <img src="https://images.pexels.com/photos/399161/pexels-photo-399161.jpeg" alt="Register Banner" />
    </div>
    <div class="form-side">
      <div class="card">
        <h1>Create Account</h1>
        <form id="registerForm" method="POST" action="php/registration.php">
          <div class="form-group">
            <input type="text" id="fullname" name="fullname" placeholder="Full Name" required />
          </div>
          <div class="form-group">
            <input type="text" id="username" name="username" placeholder="Username" required />
          </div>
          <div class="form-group">
            <input type="email" id="email" name="email" placeholder="Email" required />
          </div>
          <div class="form-group">
            <input type="password" id="password" name="password" placeholder="Password" required minlength="6" />
          </div>
          <div class="form-group">
            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm Password" required />
          </div>
          <div class="form-group">
            <select id="role" name="role" required>
              <option value="" disabled selected hidden>Select Role</option>
              <option value="admin">Admin</option>
              <option value="reader">Reader</option>
              <option value="blogger">Blogger</option>
            </select>
          </div>
          <button type="submit">Register</button>
        </form>
        <div class="footer">
          Already have an account? <a href="php/login.php">Login</a>
        </div>
      </div>
    </div>
  </div>
  <script>
    const form = document.getElementById("registerForm");
    const password = document.getElementById("password");
    const confirmPassword = document.getElementById("confirmPassword");

    form.addEventListener("submit", function (e) {
      if (password.value !== confirmPassword.value) {
        e.preventDefault();
        alert("Passwords do not match.");
      }
    });
  </script>
</body>
</html>
